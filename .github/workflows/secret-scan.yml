# 붙여넣을 위치: <레포>/.github/workflows/secret-scan.yml
# 목적: 키·비밀번호·keystore·google-services.json 등의 유출을 PR/푸시 시점에 차단한다.
# gitleaks-action 은 Organization 레포에서 라이선스 키를 요구할 수 있어, 바이너리를 고정 버전으로 직접 실행한다.
name: Secret Scan

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 전체 이력을 스캔해야 하므로 fetch-depth 0 이 필요하다.
      - name: 소스 체크아웃 (전체 이력)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 민감 파일이 git 에 추적되고 있으면 내용과 무관하게 실패시킨다.
      - name: 민감 파일 추적 여부 검사
        run: |
          TRACKED_SENSITIVE=$(git ls-files | grep -Ei '\.(jks|keystore)$|(^|/)local\.properties$|(^|/)google-services\.json$|(^|/)keystore\.properties$' || true)
          if [ -n "$TRACKED_SENSITIVE" ]; then
            echo "::error::git 에 추적되면 안 되는 민감 파일이 있습니다:"
            echo "$TRACKED_SENSITIVE"
            exit 1
          fi

      - name: gitleaks 설치
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # PR 과 merge group 은 이벤트의 base/head 범위만, push 는 전체 이력을 검사한다. 출력 값은 마스킹(--redact)한다.
      - name: gitleaks 스캔
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::PR base/head SHA 가 올바른 형식이 아닙니다."
              exit 1
            fi
            gitleaks git --redact --verbose --exit-code 2 --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if [[ "$MERGE_GROUP_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$MERGE_GROUP_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              gitleaks git --redact --verbose --exit-code 2 --log-opts="${MERGE_GROUP_BASE_SHA}..${MERGE_GROUP_HEAD_SHA}"
            else
              echo "::warning::Merge group base/head SHA 를 읽지 못해 체크아웃된 전체 이력을 검사합니다."
              gitleaks git --redact --verbose --exit-code 2
            fi
          else
            gitleaks git --redact --verbose --exit-code 2
          fi
